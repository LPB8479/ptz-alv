<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alveus PTZ</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="stylesheet" type="text/css" href="styles.css?v=1">
</head>

<body>

    <!-- Main container for direction-pad and preset-pad -->
    <div class="container">
        <div class="left-menu">

            <div class="heading-container">
                <div class="logo">
                    <img src="/img/logo.webp" alt="Logo">
                </div>

                <h1 class="ptz-heading">

                    <a href="admin.html">
                        <img src="/img/settings.png" alt="Admin Settings" class="admin-icon">
                    </a>
                </h1>
                <span class="layout-icons">
                    <span id="listIcon" class="list-icon"></span>
                    <span id="gridIcon" class="grid-icon"></span>
                    <span id="vidIcon" class="vid-icon"></span>
                </span>
            </div>


            <div class="direction-and-ptz-container">
                <!-- Container for cameras list -->
                <div class="direction-container">
                    <h2 class="direction-heading-camera">- Cameras -</h2>
                    <div class="camera-container" id="cameraContainer"></div>
                </div>

                <!-- Swap buttons -->
                <div class="direction-container">
                    <h2 class="direction-heading" style="cursor: pointer;"
                        onclick="toggleDirectionPad('.swap-container')">- Swap -</h2>
                    <div class="swap-container">
                        <div class="swap-buttons">
                            <button class="swap-num-button" onclick="setSwapNumber(2)" title="!swap 1 2">2</button>
                            <button class="swap-num-button" onclick="setSwapNumber(3)" title="!swap 1 3">3</button>
                            <button class="swap-num-button" onclick="setSwapNumber(4)" title="!swap 1 4">4</button>
                            <button class="swap-num-button" onclick="setSwapNumber(5)" title="!swap 1 5">5</button>
                            <button class="swap-num-button" onclick="setSwapNumber(6)" title="!swap 1 6">6</button>
                        </div>
                        <div class="swap-preset-buttons">
                            <button class="swap-preset-button" onclick="setPresetSwap('foxc')" title="!swap fox foxcovered">foxc</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('foxin')" title="!swap fox foxindoor">foxin</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('fc-i')" title="!swap foxcovered foxindoor">fc-i</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('crow')" title="!swap crowin crowout">crow</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('marm')" title="!swap marin marmout">marm</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('wolf')" title="!swap wolf wolfcorner">wolf</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('wolfin')" title="!swap wold wolfindoor">wolfin</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('wden')" title="!swap wolf wolfden">wden</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('wden2')" title="!swap wolfcorner wolfden2">wden2</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('ws-w')" title="!swap wolf wolfswitch">ws-w</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('wswin')" title="!swap wolfindoor wolfswitch">wswin</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('chkn')" title="!swap chicken chickenindoor">chkn</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('par')" title="!swap littles macaws">par</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('push')" title="!swap pushpop pushpopindoor">push</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('crnch')" title="!swap pushpop pushpopcrunch">crnch</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('past')" title="!swap pasture pasturelower">past</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('feed')" title="!swap pasture pasturefeeder">feed</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('gard')" title="!swap pasture garden">gard</button>
                            <!-- <button class="swap-preset-button" onclick="setPresetSwap('chin')" title="!swap chinmulti chin">chin</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('chin2')" title="!swap chinmulti chin2">chin2</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('chin3')" title="!swap chinmulti chin3">chin3</button> -->
                            <button class="swap-preset-button" onclick="setPresetSwap('c1-2')" title="!swap chin chin2">c1-2</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('c2-3')" title="!swap chin2 chin3">c2-3</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('c1-3')" title="!swap chin chin3">c1-3</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('tar')" title="!swap tarantula tarantulaptz">tar</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('toast')" title="!swap toast toastcrunch">toast</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('gorg')" title="!swap georgie georgiewater">gorg</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('serv')" title="!swap serval servalcorner">serv</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('servin')" title="!swap serval servalindoor">servin</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('sc-i')" title="!swap servalcorner servalindoor">sc-i</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('emu')" title="!swap emu emucover">emu</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('splsh')" title="!swap emu emupond">splsh</button>
                            <button class="swap-preset-button" onclick="setPresetSwap('')" title="!swap "></button>
                        </div>
                        <div class="dropdown-container">
                            <div class="swap-dropdown1">
                                <select id="swap-dropdown1">
                                    <option value="option1">-Select-</option>
                                </select>
                            </div>
                            <div class="swap-dropdown2">
                                <select id="swap-dropdown2">
                                    <option value="option1">-Select-</option>
                                </select>
                            </div>
                        </div>

                        <div class="swap-wrapper">
                            <input type="text" id="swap1" class="swap-input" placeholder="Swap 1">
                            <input type="text" id="swap2" class="swap-input" placeholder="Swap 2">
                        </div>
                        <button class="swap-button" onclick="sendSwapCommand()"
                                onmousedown="animateButton(this)">Swap</button>
                    </div>
                </div>

                <!-- Direction buttons -->
                <div class="direction-container" id="directionpadContainer" style="display: none;">
                    <h2 class="direction-heading" style="cursor: pointer;"
                        onclick="toggleDirectionPad('.direction-pad-outer')">- Direction -</h2>
                    <div class="direction-pad-outer">
                        <div class="pad-heading-container">
                            <h2 class="direction-move-heading" id="movePadHeading" style="cursor: pointer;"
                                onclick="togglePad('.direction-pad'); setActiveHeading('.direction-move-heading');">Move
                            </h2>
                            <h2 class="direction-pan-heading" id="panTiltPadHeading" style="cursor: pointer;"
                                onclick="togglePad('.pantilt-pad'); setActiveHeading('.direction-pan-heading');">PanTilt
                            </h2>
                            <h2 class="direction-zoom-heading" id="panTiltPadHeading" style="cursor: pointer;"
                                onclick="togglePad('.zoom-pad'); setActiveHeading('.direction-zoom-heading');">Zoom
                            </h2>
                        </div>
                        <div class="direction-container-inner">

                            <div class="direction-pad">
                                <button class="arrow-button" onclick="sendDirectionCommand('upleft')"
                                        onmousedown="animateButton(this)">↖</button>
                                <button class="arrow-button" onclick="sendDirectionCommand('up')"
                                        onmousedown="animateButton(this)">▲</button>
                                <button class="arrow-button" onclick="sendDirectionCommand('upright')"
                                        onmousedown="animateButton(this)">↗</button>
                                <button class="arrow-button" onclick="sendDirectionCommand('left')"
                                        onmousedown="animateButton(this)">◀</button>
                                <button class="arrow-button" onclick="sendDirectionCommand('')"
                                        onmousedown="animateButton(this)"></button>
                                <button class="arrow-button" onclick="sendDirectionCommand('right')"
                                        onmousedown="animateButton(this)">▶</button>
                                <button class="arrow-button" onclick="sendDirectionCommand('downleft')"
                                        onmousedown="animateButton(this)">↙</button>
                                <button class="arrow-button" onclick="sendDirectionCommand('down')"
                                        onmousedown="animateButton(this)">▼</button>
                                <button class="arrow-button" onclick="sendDirectionCommand('downright')"
                                        onmousedown="animateButton(this)">↘</button>
                            </div>

                            <div class="pantilt-pad hidden">
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" onclick="sendptzpadCommand('up')"
                                        onmousedown="animateButton(this)">▲</button>
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" onclick="sendptzpadCommand('left')"
                                        onmousedown="animateButton(this)">◀</button>
                                <button class="ptz-arrow-button" id="sliderValueLabel"
                                        onclick="toggleValues()">1</button>
                                <button class="ptz-arrow-button" onclick="sendptzpadCommand('right')"
                                        onmousedown="animateButton(this)">▶</button>
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" onclick="sendptzpadCommand('down')"
                                        onmousedown="animateButton(this)">▼</button>
                                <button class="arrow-button"></button>
                            </div>
                            <div class="zoom-pad hidden">
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" onclick="sendpadZoom('plus')"
                                        onmousedown="animateButton(this)">+</button>
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" onclick="decrementZoom()"
                                        onmousedown="animateButton(this)">◀</button>
                                <button class="ptz-arrow-button" id="sliderZoomLabel" style="font-size: 17px;">10%</button>
                                <button class="ptz-arrow-button" onclick="incrementZoom()"
                                        onmousedown="animateButton(this)">▶</button>
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" onclick="sendpadZoom('minus')"
                                        onmousedown="animateButton(this)">-</button>
                                <button class="arrow-button"></button>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Zoom input buttons -->
                <div class="direction-container" id="zoomContainer">
                    <h2 class="direction-heading" style="cursor: pointer;"
                        onclick="toggleDirectionPad('.zoom-menu-outer')">- Zoom -</h2>
                    <div class="zoom-menu-outer">
                        <div class="zoom-button-container">
                            <div class="zoom-buttons">
                                <button id="nfcToggle" class="zoom-button" onclick="toggleNFC()" title="Non-focus control">NFC</button>
                                <button class="zoom-button" onclick="sendZoomButton('0')" title="!ptzzoom [camname] 0">0</button>
                                <button class="zoom-button" onclick="sendZoomButton('25')" title="!ptzzoom [camname] 25">25</button>
                                <button class="zoom-button" onclick="sendZoomButton('30')" title="!ptzzoom [camname] 30">30</button>
                                <button class="zoom-button" onclick="sendZoomButton('40')" title="!ptzzoom [camname] 40">40</button>
                                <button class="zoom-button" onclick="sendZoomButton('50')" title="!ptzzoom [camname] 50">50</button>
                                <button class="zoom-button" onclick="sendZoomButton('60')" title="!ptzzoom [camname] 60">60</button>
                                <button class="zoom-button" onclick="sendZoomButton('70')" title="!ptzzoom [camname] 70">70</button>
                                <button class="zoom-button" onclick="sendZoomButton('75')" title="!ptzzoom [camname] 75">75</button>
                                <button class="zoom-button" onclick="sendZoomButton('80')" title="!ptzzoom [camname] 80">80</button>
                                <button class="zoom-button" onclick="sendZoomButton('90')" title="!ptzzoom [camname] 90">90</button>
                                <button class="zoom-button" onclick="sendZoomButton('125')" title="!ptzzoom [camname] 125">125</button>
                                <button class="zoom-button" onclick="sendZoomButton('130')" title="!ptzzoom [camname] 130">130</button>
                                <button class="zoom-button" onclick="sendZoomButton('140')" title="!ptzzoom [camname] 140">140</button>
                                <button class="zoom-button" onclick="sendZoomButton('150')" title="!ptzzoom [camname] 150">150</button>
                                <button class="zoom-button" onclick="sendZoomButton('200')" title="!ptzzoom [camname] 200">200</button>
                                <button class="zoom-button" onclick="sendZoomButton('300')" title="!ptzzoom [camname] 300">300</button>
                                <button class="zoom-button" onclick="sendZoomButton('400')" title="!ptzzoom [camname] 400">400</button>
                            </div>
                        </div>
                        <div class="zoom-menu-inner">
                            <div class="zoomr-menu">
                                <div class="zoom-dropdown-wrapper">
                                    <div class="zoom-dropdown">
                                        <select id="zoom-dropdown">
                                            <option value="option1">-Select-</option>
                                        </select>
                                    </div>
                                    <input type="text" id="zoomRInput" class="zoominput" placeholder="Zoom %" min="0" max="1000">
                                </div>
                                <button class="send-button-zoom" onclick="sendZoomR()" onmousedown="animateButton(this)">Send</button>
                            </div>

                            <div class="zoom-menu hidden">
                                <div class="zoom-slider-wrapper">
                                    <input type="range" min="-100" max="100" value="0" step="5" class="slider" id="zoomSlider">
                                    <input type="text" id="zoomInput" class="zoominput" placeholder="Zoom" min="1" max="100">
                                </div>
                                <button class="send-button-zoom" onclick="sendZoom()" onmousedown="animateButton(this)">Send</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PTZ input buttons -->
                <div class="direction-container" id="ptzContainer" style="display: none;">
                    <h2 class="direction-heading" style="cursor: pointer;"
                        onclick="toggleDirectionPad('.ptz-container')">- PTZ -</h2>
                    <div class="ptz-container">
                        <div class="ptz-input-wrapper">
                            <input type="text" id="panInput" class="ptz-input" placeholder="Pan">
                            <input type="text" id="tiltInput" class="ptz-input" placeholder="Tilt">
                            <input type="text" id="zoomPTZInput" class="ptz-input" placeholder="Zoom">
                        </div>
                        <button class="send-button" onclick="sendPanTiltZoom()"
                                onmousedown="animateButton(this)">Send</button>
                    </div>
                </div>

                <!-- Focus buttons -->
                <div class="direction-container">
                    <h2 class="direction-heading" style="cursor: pointer;"
                        onclick="toggleDirectionPad('.focus-container')">- Focus -</h2>
                    <div class="focus-container">
                        <div class="focus-wrapper">
                            <button class="cfocus-button icon-button" onclick="enableCFocus(this)" style="display: none;"></button>
                            <button class="autofocus-button icon-button" onclick="sendAutoFocusCommand('on')" title="!ptzautofocus [camera] on"></button>
                            <input type="text" id="focus" class="focus-input" placeholder="Focus">
                        </div>
                        <button class="focus-button" onclick="sendFocusCommand()"
                                onmousedown="animateButton(this)">Focus</button>
                    </div>

                </div>

                <!-- IR buttons -->
                <div class="direction-container" id="irContainer" style="display: none;">
                    <h2 class="direction-heading" style="cursor: pointer;"
                        onclick="toggleDirectionPad('.ir-container')">- IR -</h2>
                    <div class="ir-container">
                        <div class="ir-wrapper">
                            <button class="ir-auto-button" onclick="sendIRcommand('auto')">Auto</button>
                            <button class="ir-on-button" onclick="sendIRcommand('on')">On</button>
                            <button class="ir-off-button" onclick="sendIRcommand('off')">Off</button>
                        </div>
                    </div>
                </div>

                <!-- Other buttons -->
                <div class="direction-container">
                    <h2 class="direction-heading" style="cursor: pointer;"
                        onclick="toggleDirectionPad('.other-container')">- Other -</h2>
                    <div class="other-container">
                        <div class="other-wrapper">
                            <button class="scenecams-button icon-button" onclick="sendScenecams()" title="!scenecams"></button>
                            <button class="info-button icon-button" onclick="sendInfo()" title="!ptzgetinfo"></button>
                            <button class="reset-button icon-button" onclick="sendReset()" title="!resetcam"></button>
                            <button class="resetstream-button icon-button" onclick="sendResetStream()" title="!resetlivecams"></button>
                            <button class="volume-button icon-button" onclick="sendVolumeControl()" title="!getvolume all"></button>
                            <button class="mpv-button icon-button" onclick="enableSpin(this)" style="display: none;"></button>
                            <button class="wolftext-button icon-button" onclick="sendWolftext()" title="Toggle !wolftext"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="video-placeholder"></div>

        <div class="right-side">

            <!-- Preset Container -->
            <div class="preset-container grid-layout">
                <div class="preset-container-card">

                    <div class="preset-header">
                        <div class="vidbuttondiv" style="display: none;">
                            <button class="vidbuttons" onclick="toggleVideo('video')">Video</button>
                            <button class="vidbuttons" id="openDialogButton">Presets</button>
                        </div>
                        <h2 class="label-preset-heading" style="cursor: pointer;"
                            onclick="toggleDirectionPad('.preset-pad')">- Presets -</h2>
                        <input type="text" id="presetSearch" placeholder="Search..">
                    </div>

                    <div class="preset-pad" id="presetPad">
                        <!-- These will be dynamically populated based on the selected camera -->
                    </div>


                    <div class="custom-preset-container">
                        <h2 class="custom-label-preset">- Custom Presets -</h2>
                        <div class="custom-preset-pad" id="customPresetPad" style="display: none;">
                            <!-- These will be dynamically populated based on the selected camera -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <form id="commandForm" action="/send-command" method="post">
        <input type="hidden" id="commandInput" name="command">
    </form>

    <script>
        function openAdminPage() {
            window.location.href = "admin.html";
        }
    </script>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.5.0/fabric.min.js"></script>

</body>

</html>
